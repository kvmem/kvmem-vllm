[build-system]
requires = ["setuptools>=77,<81", "pybind11>=3,<4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kvmem"
version = "0.1.0.dev1"
description = "Bounded, query-selected long-context memory for vLLM"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/qw3/LICENSE", "third_party/vllm/LICENSE"]

[project.optional-dependencies]
vllm = ["vllm>=0.30.0", "ninja>=1.11,<2"]
test = ["pytest>=8,<10"]

[project.entry-points."vllm.general_plugins"]
kvmem = "vllm_kvmem:register"

[project.entry-points."vllm.endpoint_plugins"]
kvmem = "vllm_kvmem.systemone:SystemOnePlugin"

[project.scripts]
vllm-kvmem = "vllm_kvmem.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
